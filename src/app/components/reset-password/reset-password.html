<div class="reset-container">
  <div class="reset-card">
    <h2>Reset Password</h2>

    <input
      type="password"
      [(ngModel)]="oldPassword"
      placeholder="Old Password"
    />

    <input
      type="password"
      [(ngModel)]="newPassword"
      placeholder="New Password"
    />

    <input
      type="password"
      [(ngModel)]="confirmPassword"
      placeholder="Confirm Password"
    />

    <!-- ✅ Validation message under fields -->
    <p class="error-msg" *ngIf="errorMessage">{{ errorMessage }}</p>

    <button (click)="resetPassword()">Change Password</button>
    <button class="back" (click)="backstep()">Back</button>
  </div>
</div>
