<div class="edit-profile-container">
  <h2>Edit Profile</h2>

  <form (ngSubmit)="saveChanges()" enctype="multipart/form-data">
    <div class="form-group">
      <label>Name:</label>
      <input
        type="text"
        [(ngModel)]="user.name"
        name="name"
        required
        pattern="^[A-Za-z\s]{3,30}$"
      />
    </div>

    <div class="form-group">
      <label>Email:</label>
      <input
        type="email"
        [(ngModel)]="user.email"
        name="email"
        required
      />
    </div>

    <div class="form-group">
      <label>Phone Number:</label>
      <input
        type="text"
        [(ngModel)]="user.phoneNumber"
        name="phoneNumber"
        required
        pattern="^[0-9]{10}$"
      />
    </div>

    <div class="form-group">
      <label>Gender:</label>
      <select [(ngModel)]="user.gender" name="gender" required>
        <option value="">Select</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
      </select>
    </div>

    <div class="form-group">
      <label>Age:</label>
      <input
        type="number"
        [(ngModel)]="user.age"
        name="age"
        required
        min="1"
      />
    </div>

    <div class="form-group">
      <label>Address:</label>
      <textarea
        [(ngModel)]="user.address"
        name="address"
        required
        minlength="3"
      ></textarea>
    </div>

    <div class="form-group">
      <label>LinkedIn:</label>
      <input
        type="text"
        [(ngModel)]="user.linkedin"
        name="linkedin"
        pattern="^https?:\/\/(www\.)?linkedin\.com\/.*$"
      />
    </div>

    <div class="form-group">
      <label>GitHub:</label>
      <input
        type="text"
        [(ngModel)]="user.github"
        name="github"
        pattern="^https?:\/\/(www\.)?github\.com\/[A-Za-z0-9_-]+$"
      />
    </div>

    <div class="form-group">
      <label>Profile Photo:</label>
      <input type="file" (change)="onPhotoSelected($event)" />
    </div>

    <button type="submit" class="save-btn">Save Changes</button>
    <p></p>
    <button type="button" class="save-btn" (click)="backstep()">Back</button>
  </form>
</div>
